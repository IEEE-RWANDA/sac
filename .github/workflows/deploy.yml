name: Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ENV: ${{ github.event_name == 'push' && 'production' || 'preview' }}
      PROD_FLAG: ${{ github.event_name == 'push' && '--prod' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install --global vercel@latest

      # Upload source and let Vercel build it remotely, so the build matches
      # what Vercel serves.
      - name: Deploy
        id: deploy
        run: |
          echo "url=$(vercel deploy $PROD_FLAG --yes --token=$VERCEL_TOKEN)" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "Deployed ($VERCEL_ENV): ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
